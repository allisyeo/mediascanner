<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — KT MediaScanner</title>
  <style>
    :root {
      --bg:          #f5f7fb;
      --panel:       #ffffff;
      --text:        #151923;
      --muted:       #697386;
      --line:        #e6eaf1;
      --dark:        #0f172a;
      --accent:      #2557d6;
      --accent-soft: #eaf0ff;
      --green:       #0f9f6e;
      --green-soft:  #e8f8f2;
      --red:         #d92d20;
      --red-soft:    #fff0ef;
      --shadow:      0 16px 40px rgba(16,24,40,0.10);
      --radius:      20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Фоновые декоративные круги */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      top: -200px; left: -200px;
      background: radial-gradient(circle, rgba(37,87,214,0.08) 0%, transparent 70%);
    }
    body::after {
      width: 500px; height: 500px;
      bottom: -150px; right: -150px;
      background: radial-gradient(circle, rgba(105,65,198,0.07) 0%, transparent 70%);
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    /* Логотип + название */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      letter-spacing: -0.04em;
      box-shadow: 0 12px 28px rgba(59,130,246,0.35);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--dark);
    }

    .brand-text p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Карточка формы */
    .login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 36px 32px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Поля формы */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 7px;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 13px 15px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,87,214,0.12);
    }

    .form-group input.error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(217,45,32,0.10);
    }

    /* Кнопка входа */
    .btn-login {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(37,87,214,0.22);
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }

    .btn-login:hover:not(:disabled) {
      background: #1d48c4;
      box-shadow: 0 10px 24px rgba(37,87,214,0.30);
    }

    .btn-login:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-login .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Сообщение об ошибке */
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--red-soft);
      border: 1px solid #fecaca;
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      align-items: center;
      gap: 8px;
    }

    .error-msg.visible {
      display: flex;
    }

    .error-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    /* Demo-подсказка */
    .demo-hint {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 13px;
      background: var(--accent-soft);
      border: 1px solid #c7d7ff;
    }

    .demo-hint .demo-label {
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .demo-hint .demo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #374151;
      padding: 3px 0;
    }

    .demo-hint .demo-row strong {
      font-weight: 700;
      color: var(--dark);
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
    }

    .demo-hint .copy-btn {
      border: none;
      background: rgba(37,87,214,0.10);
      color: var(--accent);
      border-radius: 7px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
    }

    .demo-hint .copy-btn:hover {
      background: rgba(37,87,214,0.18);
    }

    /* Подвал */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    /* Адаптив */
    @media (max-width: 480px) {
      .login-card { padding: 28px 22px 26px; }
      .brand-text h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">

    <div class="brand">
      <div class="logo">MS</div>
      <div class="brand-text">
        <h1>KT MediaScanner</h1>
        <p>Social listening platform</p>
      </div>
    </div>

    <div class="login-card">
      <h2>Вход в систему</h2>
      <p class="subtitle">Мониторинг упоминаний, тональности и активности по источникам</p>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="username">Логин</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Введите логин"
            autocomplete="username"
            spellcheck="false"
          />
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <div class="spinner"></div>
          <span class="btn-text">Войти</span>
        </button>

        <div class="error-msg" id="errorMsg">
          <span class="error-icon">⚠</span>
          <span id="errorText">Неверный логин или пароль</span>
        </div>
      </form>

      <div class="demo-hint">
        <div class="demo-label">Demo-доступ</div>
        <div class="demo-row">
          <span>Логин</span>
          <span><strong id="demoUser">allisyeo</strong></span>
          <button class="copy-btn" onclick="fillField('username','allisyeo')">Вставить</button>
        </div>
        <div class="demo-row" style="margin-top:4px">
          <span>Пароль</span>
          <span><strong>45aseFUG@</strong></span>
          <button class="copy-btn" onclick="fillField('password','45aseFUG@')">Вставить</button>
        </div>
      </div>
    </div>

    <div class="login-footer">
      KT MediaScanner &nbsp;·&nbsp; защищённый вход
    </div>
  </div>

  <script>
    // Если уже авторизован — сразу на главную
    (async function checkAlreadyLoggedIn() {
      try {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        if (res.ok) {
          window.location.href = "/";
        }
      } catch {
        // backend недоступен — остаёмся на странице входа
      }
    })();

    // Вставить demo-значение в поле
    function fillField(fieldId, value) {
      document.getElementById(fieldId).value = value;
      document.getElementById(fieldId).focus();
    }

    // Показать / скрыть ошибку
    function showError(msg) {
      const el   = document.getElementById("errorMsg");
      const text = document.getElementById("errorText");
      text.textContent = msg || "Неверный логин или пароль";
      el.classList.add("visible");
      document.getElementById("username").classList.add("error");
      document.getElementById("password").classList.add("error");
    }

    function hideError() {
      document.getElementById("errorMsg").classList.remove("visible");
      document.getElementById("username").classList.remove("error");
      document.getElementById("password").classList.remove("error");
    }

    // Кнопка: loading state
    function setLoading(on) {
      const btn = document.getElementById("loginBtn");
      btn.classList.toggle("loading", on);
      btn.disabled = on;
    }

    // Сброс ошибки при вводе
    ["username", "password"].forEach(id => {
      document.getElementById(id).addEventListener("input", hideError);
    });

    // Отправка формы
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showError("Введите логин и пароль");
        return;
      }

      setLoading(true);

      try {
        const res = await fetch("/api/auth/login", {
          method:      "POST",
          credentials: "include",             // важно: отправляем/получаем cookie
          headers:     { "Content-Type": "application/json" },
          body:        JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
          // Успешный вход — переход на главную страницу
          window.location.href = "/";
        } else if (res.status === 429) {
          showError("Слишком много попыток. Подождите 15 минут.");
        } else {
          showError(data.message || "Неверный логин или пароль");
        }
      } catch {
        showError("Сервер недоступен. Проверьте подключение.");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
